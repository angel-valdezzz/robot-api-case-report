name: Live users API demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-demo:
    runs-on: ubuntu-latest
    env:
      DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
      DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --only main
      - run: poetry run python scripts/run_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-user-case-reports
          path: |
            results/
            results-ddt/
