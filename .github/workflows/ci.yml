name: Verify API testing example
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry check --lock
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run robocop check resources tests
      - run: poetry run robocop format --check resources tests
      - run: poetry run python scripts/run_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-reports
          path: |
            results/cases/*.html
            results-ddt/cases/*.html
            results/console.log
            results-ddt/console.log
